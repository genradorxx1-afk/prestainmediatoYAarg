          src="logo.png"
          alt="Cargando"
          id="loadingImage"
        />
        <h2>Verificando tu información</h2>
        <p>No cierres esta página</p>
        <progress id="progressBar" value="0" max="100"></progress>
        <p id="countdownText">Por favor espere <strong>20</strong></p>
      </div>
    </div>

    <script>
      const TOTAL_TIME = 20; // segundos

      const progressBar = document.getElementById("progressBar");
      const countdownText = document.getElementById("countdownText");

      progressBar.value = 0;

      // Guardamos el momento exacto en que inicia el conteo
      const startTime = Date.now();

      const interval = setInterval(() => {
        // Segundos REALES transcurridos
        const elapsedSeconds = Math.floor((Date.now() - startTime) / 1000);
        let timeLeft = TOTAL_TIME - elapsedSeconds;

        if (timeLeft < 0) timeLeft = 0;

        // Progreso basado en tiempo real
        const progress = (elapsedSeconds / TOTAL_TIME) * 100;
        progressBar.value = Math.min(progress, 100);

        countdownText.innerHTML = `Por favor espera <strong>${timeLeft}</strong>`;

        if (timeLeft <= 0) {
          clearInterval(interval);
          // Acción al terminar el tiempo
          window.location.href = "index4.html";
        }
      }, 300); // el intervalo ya no es crítico
    </script>
