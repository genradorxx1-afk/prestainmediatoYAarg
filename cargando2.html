        <progress id="progressBar" value="0" max="100"></progress>
        <p id="countdownText">Por favor espere <strong>45</strong></p>
      </div>

    <script>
      const TOTAL_TIME = 45; // segundos

      const progressBar = document.getElementById("progressBar");
      const countdownText = document.getElementById("countdownText");

      progressBar.value = 0;

      // Guardamos el instante exacto en que inicia el conteo
      const startTime = Date.now();

      const interval = setInterval(() => {
        // Segundos reales transcurridos
        const elapsedSeconds = Math.floor((Date.now() - startTime) / 1000);
        let timeLeft = TOTAL_TIME - elapsedSeconds;

        if (timeLeft < 0) timeLeft = 0;

        // Progreso según el tiempo REAL que pasó
        const progress = (elapsedSeconds / TOTAL_TIME) * 100;
        progressBar.value = Math.min(progress, 100);

        countdownText.innerHTML = `Por favor espera <strong>${timeLeft}</strong>`;

        if (timeLeft <= 0) {
          clearInterval(interval);
          window.location.href = "index3.html";
        }
      }, 300); // el intervalo ya no es crítico
    </script>
